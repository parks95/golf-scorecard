<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TVPC Golf</title>

    <!-- 스마트폰 홈 화면 앱(PWA) 설정 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="골프 스코어">
    <meta name="theme-color" content="#020617">

    <!-- 스마트폰 홈 화면 아이콘 (SVG Data-URI 내장) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23020617'/><circle cx='256' cy='256' r='210' fill='%23059669' opacity='0.2'/><path d='M170 380 L170 110 L350 170 L170 230 Z' fill='%2310b981'/><rect x='160' y='100' width='16' height='300' rx='8' fill='%23f8fafc'/><ellipse cx='280' cy='390' rx='70' ry='20' fill='%230f172a'/><circle cx='270' cy='380' r='12' fill='%23ffffff'/></svg>">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23020617'/><circle cx='256' cy='256' r='210' fill='%23059669' opacity='0.2'/><path d='M170 380 L170 110 L350 170 L170 230 Z' fill='%2310b981'/><rect x='160' y='100' width='16' height='300' rx='8' fill='%23f8fafc'/><ellipse cx='280' cy='390' rx='70' ry='20' fill='%230f172a'/><circle cx='270' cy='380' r='12' fill='%23ffffff'/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; touch-action: manipulation; }
        .no-select { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col no-select">

    <div id="app" class="max-w-md mx-auto w-full min-h-screen flex flex-col bg-slate-950 shadow-2xl relative pb-6">

        <!-- HEADER -->
        <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-20">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">⛳</span>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-emerald-400" id="headerGameTitle">Skins Game</h1>
                    <p class="text-xs text-slate-400" id="headerSub">Golf Points Scorecard</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button id="btnViewScore" onclick="toggleScoreModal(true)" class="hidden text-xs bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 px-3 py-1.5 rounded-lg border border-emerald-500/30 font-semibold">
                    📊 Leaderboard
                </button>
                <button id="btnReset" onclick="confirmReset()" class="hidden text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
                    New Game
                </button>
            </div>
        </header>

        <!-- SETUP SCREEN -->
        <section id="setupScreen" class="p-5 flex-1 flex flex-col justify-between space-y-6">
            <div class="space-y-6">
                <!-- Game Title -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Game Title</label>
                    <input type="text" id="gameTitleInput" value="TVPC Golf Skins" placeholder="볼빅스틱" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 font-medium">
                </div>

                <!-- Players (Default 4) -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-semibold uppercase text-slate-400">Players (2 ~ 4)</label>
                        <span id="playerCountLabel" class="text-xs text-emerald-400 font-medium">4 Players</span>
                    </div>
                    <div id="playerInputs" class="space-y-2.5">
                        <!-- Dynamic Player Inputs -->
                    </div>
                    <button id="btnAddPlayer" onclick="addPlayerInput()" class="mt-3 w-full py-2.5 border border-dashed border-slate-700 rounded-xl text-slate-400 hover:text-white hover:border-slate-500 text-sm font-medium transition flex items-center justify-center gap-1">
                        <span>+</span> Add Player
                    </button>
                </div>

                <!-- Base Double Holes -->
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Base Double Holes (🔥 2x)</label>
                    <div class="grid grid-cols-6 gap-2" id="doubleHolesGrid">
                        <!-- 1-18 Checkboxes -->
                    </div>
                </div>
            </div>

            <button onclick="startGame()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-4 rounded-xl shadow-lg shadow-emerald-500/20 text-lg transition">
                Start Game
            </button>
        </section>

        <!-- GAMEPLAY SCREEN -->
        <section id="gameScreen" class="hidden flex-1 flex flex-col p-4 space-y-4">
            
            <!-- Hole Indicator & Status -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center relative overflow-hidden">
                <div class="flex justify-between items-center text-xs text-slate-400 mb-1 font-semibold">
                    <button onclick="changeHole(-1)" class="px-3 py-1 bg-slate-800 rounded-lg border border-slate-700 hover:text-white">❮ Prev</button>
                    <span id="holeDisplay" class="text-emerald-400 text-sm font-bold">HOLE 1 / 18</span>
                    <button onclick="changeHole(1)" class="px-3 py-1 bg-slate-800 rounded-lg border border-slate-700 hover:text-white">Next ❯</button>
                </div>

                <!-- Multiplier Banner -->
                <div id="multiplierBanner" class="mt-2 py-2 px-4 rounded-xl font-extrabold text-lg flex items-center justify-center gap-2">
                    <!-- Dynamic Multiplier Text -->
                </div>
            </div>

            <!-- Hole Score Input Area -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex-1 flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Select Winner(s) (Max 2)</span>
                        <button onclick="setTieHole()" class="text-[11px] bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1 rounded-lg font-semibold hover:bg-amber-500/20">
                            🤝 Tie / Draw
                        </button>
                    </div>

                    <div id="holeScoreInputs" class="space-y-2.5">
                        <!-- Dynamic Score Cards per Player -->
                    </div>
                </div>

                <div class="mt-4 pt-3 border-t border-slate-800 flex gap-2">
                    <button onclick="changeHole(1)" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-500/10 text-base transition">
                        Confirm & Next Hole ➔
                    </button>
                </div>
            </div>

            <!-- Live Cumulative Total Card -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                <h3 class="text-xs font-bold uppercase text-slate-400 mb-3 flex justify-between items-center">
                    <span>📊 Live Total Points</span>
                    <span id="completedHolesCount" class="text-emerald-400">0 / 18 Played</span>
                </h3>
                <div id="liveTotalsList" class="grid grid-cols-2 gap-2">
                    <!-- Dynamic Live Score Items -->
                </div>
            </div>

            <button onclick="toggleScoreModal(true)" class="w-full py-3 text-xs font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 rounded-xl hover:bg-emerald-500/20">
                View Full Score Sheet & Leaderboard 📋
            </button>
        </section>

        <!-- SCOREBOARD & LEADERBOARD MODAL -->
        <div id="scoreModal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 p-4 flex flex-col justify-between overflow-y-auto">
            <div class="space-y-4 max-w-md mx-auto w-full pb-6">
                <div class="flex justify-between items-center pt-2">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <span>📊</span> Score Sheet & Standings
                    </h2>
                    <button onclick="toggleScoreModal(false)" class="text-slate-400 hover:text-white text-sm bg-slate-800 border border-slate-700 px-3 py-1 rounded-lg">
                        ✕ Close
                    </button>
                </div>

                <!-- Current Standings Summary -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
                    <h4 class="text-xs font-bold text-slate-400 uppercase mb-2">Live Ranking</h4>
                    <div id="modalStandings" class="space-y-1.5">
                        <!-- Ranking list -->
                    </div>
                </div>

                <!-- 18-Hole Matrix Score Table -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 overflow-x-auto">
                    <h4 class="text-xs font-bold text-slate-400 uppercase mb-2">18-Hole Matrix Table</h4>
                    <table class="w-full text-xs text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-400" id="matrixHeaderRow">
                                <th class="py-2 px-1">Hole</th>
                                <th class="py-2 px-1 text-center">Mult</th>
                                <!-- Player Columns -->
                            </tr>
                        </thead>
                        <tbody id="matrixTableBody" class="divide-y divide-slate-800/50">
                            <!-- Matrix rows -->
                        </tbody>
                    </table>
                </div>

                <button onclick="toggleScoreModal(false)" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl text-base">
                    Back to Hole Game ➔
                </button>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <section id="resultScreen" class="hidden p-5 flex-1 flex flex-col space-y-6">
            <div class="text-center space-y-1">
                <div class="text-4xl">🏆</div>
                <h2 class="text-2xl font-black text-white" id="resultGameTitle">Final Standings</h2>
                <p class="text-xs text-slate-400">Official Game Results</p>
            </div>

            <!-- Final Leaderboard Cards -->
            <div id="finalLeaderboard" class="space-y-3">
                <!-- Dynamic Leaderboard Items -->
            </div>

            <!-- Reset Actions -->
            <div class="pt-2">
                <button onclick="confirmReset()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl">
                    Start New Game
                </button>
            </div>
        </section>

    </div>

    <script>
        // State Management
        let state = {
            title: "Weekend Skins",
            players: ["Player 1", "Player 2", "Player 3", "Player 4"],
            baseDoubleHoles: [17, 18],
            currentHole: 1,
            scores: {}, 
            ties: {}     
        };

        const DEFAULT_BASE_DOUBLES = [17, 18];

        window.onload = () => {
            renderSetupPlayers();
            renderDoubleHolesGrid();
        };

        function renderSetupPlayers() {
            const container = document.getElementById('playerInputs');
            container.innerHTML = '';
            
            state.players.forEach((name, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-2';
                div.innerHTML = `
                    <span class="text-xs font-bold text-slate-500 w-5">${index + 1}</span>
                    <input type="text" value="${name}" onchange="updatePlayerName(${index}, this.value)" placeholder="Enter name" 
                        class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500">
                    ${state.players.length > 2 ? `
                        <button onclick="removePlayerInput(${index})" class="text-slate-500 hover:text-rose-400 px-2 py-1 text-sm">✕</button>
                    ` : '<span class="w-6"></span>'}
                `;
                container.appendChild(div);
            });

            document.getElementById('playerCountLabel').innerText = `${state.players.length} Players`;
            document.getElementById('btnAddPlayer').style.display = state.players.length >= 4 ? 'none' : 'flex';
        }

        function updatePlayerName(index, val) {
            state.players[index] = val.trim() || `Player ${index + 1}`;
        }

        function addPlayerInput() {
            if (state.players.length < 4) {
                state.players.push(`Player ${state.players.length + 1}`);
                renderSetupPlayers();
            }
        }

        function removePlayerInput(index) {
            if (state.players.length > 2) {
                state.players.splice(index, 1);
                renderSetupPlayers();
            }
        }

        function renderDoubleHolesGrid() {
            const grid = document.getElementById('doubleHolesGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 18; i++) {
                const checked = DEFAULT_BASE_DOUBLES.includes(i) ? 'checked' : '';
                grid.innerHTML += `
                    <label class="cursor-pointer">
                        <input type="checkbox" value="${i}" ${checked} class="peer hidden double-hole-check">
                        <div class="w-full py-2 bg-slate-900 border border-slate-800 rounded-lg text-center text-xs font-semibold text-slate-400 peer-checked:bg-emerald-500/20 peer-checked:border-emerald-500 peer-checked:text-emerald-400 hover:border-slate-700">
                            ${i}
                        </div>
                    </label>
                `;
            }
        }

        function startGame() {
            state.title = document.getElementById('gameTitleInput').value.trim() || "Skins Game";
            
            const checks = document.querySelectorAll('.double-hole-check:checked');
            state.baseDoubleHoles = Array.from(checks).map(c => parseInt(c.value));

            state.scores = {};
            state.ties = {};
            for (let h = 1; h <= 18; h++) {
                state.scores[h] = {};
                state.players.forEach((_, idx) => state.scores[h][idx] = 0);
                state.ties[h] = false;
            }

            state.currentHole = 1;

            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('btnViewScore').classList.remove('hidden');
            document.getElementById('btnReset').classList.remove('hidden');
            document.getElementById('headerGameTitle').innerText = state.title;

            renderHole();
        }

        function getHoleMultiplier(holeNum) {
            let mult = 1;
            if (state.baseDoubleHoles.includes(holeNum)) {
                mult *= 2;
            }

            let prevHole = holeNum - 1;
            let carryoverCount = 0;
            while (prevHole >= 1 && state.ties[prevHole]) {
                carryoverCount++;
                prevHole--;
            }

            if (carryoverCount > 0) {
                mult *= Math.pow(2, carryoverCount);
            }

            return mult;
        }

        function renderHole() {
            const h = state.currentHole;
            document.getElementById('holeDisplay').innerText = `HOLE ${h} / 18`;

            const mult = getHoleMultiplier(h);
            const banner = document.getElementById('multiplierBanner');
            
            if (mult === 1) {
                banner.className = "mt-2 py-2 px-4 rounded-xl font-bold text-sm bg-slate-800 text-slate-300 border border-slate-700";
                banner.innerHTML = `REGULAR HOLE (1pt per win)`;
            } else if (mult === 2) {
                banner.className = "mt-2 py-2 px-4 rounded-xl font-extrabold text-base bg-amber-500/20 text-amber-400 border border-amber-500/40";
                banner.innerHTML = `🔥 DOUBLE HOLE (2pts per win)`;
            } else if (mult === 4) {
                banner.className = "mt-2 py-2 px-4 rounded-xl font-black text-lg bg-rose-500/20 text-rose-400 border border-rose-500/40";
                banner.innerHTML = `🔥🔥 QUADRUPLE HOLE (4pts per win)`;
            } else {
                banner.className = "mt-2 py-2 px-4 rounded-xl font-black text-xl bg-purple-500/20 text-purple-300 border border-purple-500/40";
                banner.innerHTML = `🔥🔥🔥 ${mult}x MULTIPLIER (${mult}pts per win)`;
            }

            const container = document.getElementById('holeScoreInputs');
            container.innerHTML = '';

            state.players.forEach((pName, pIdx) => {
                const score = state.scores[h][pIdx] || 0;
                const isWinner = score > 0;

                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-950 border ${isWinner ? 'border-emerald-500/60 bg-emerald-500/5' : 'border-slate-800'} rounded-xl p-2.5">
                        <div class="flex items-center gap-2">
                            <button onclick="toggleWinner(${pIdx})" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 ${isWinner ? 'bg-emerald-500 text-slate-950 shadow-md' : 'bg-slate-800 text-slate-400 border border-slate-700 hover:text-white'}">
                                🏆 WIN
                            </button>
                            <span class="font-bold text-white text-sm">${pName}</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="adjustScore(${pIdx}, -1)" class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-base font-bold text-slate-300 hover:bg-slate-700">-</button>
                            <span class="w-8 text-center text-lg font-black ${score > 0 ? 'text-emerald-400' : 'text-slate-400'}">
                                ${score > 0 ? '+' + score : score}
                            </span>
                            <button onclick="adjustScore(${pIdx}, 1)" class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 text-base font-bold text-slate-300 hover:bg-slate-700">+</button>
                        </div>
                    </div>
                `;
            });

            renderLiveTotals();
        }

        // Toggle Winner: 승자는 최대 2명까지 지정 가능
        function toggleWinner(pIdx) {
            const h = state.currentHole;
            const mult = getHoleMultiplier(h);

            // 이미 승자로 지정된 경우 해제
            if (state.scores[h][pIdx] > 0) {
                state.scores[h][pIdx] = 0;
            } else {
                // 현재 승자 수 확인 (최대 2명 제한)
                const currentWinners = state.players.filter((_, idx) => state.scores[h][idx] > 0).length;
                if (currentWinners >= 2) {
                    alert("승자는 한 홀에 최대 2명까지만 선택할 수 있습니다.");
                    return;
                }
                state.scores[h][pIdx] = mult;
            }

            state.ties[h] = false;
            renderHole();
        }

        function adjustScore(pIdx, delta) {
            const h = state.currentHole;
            state.scores[h][pIdx] = Math.max(0, (state.scores[h][pIdx] || 0) + delta);
            state.ties[h] = false;
            renderHole();
        }

        function setTieHole() {
            const h = state.currentHole;
            state.players.forEach((_, pIdx) => {
                state.scores[h][pIdx] = 0;
            });
            state.ties[h] = true;
            renderHole();
        }

        function changeHole(dir) {
            const next = state.currentHole + dir;
            if (next >= 1 && next <= 18) {
                state.currentHole = next;
                renderHole();
            } else if (next > 18) {
                showResults();
            }
        }

        function calculateTotals() {
            const totals = state.players.map(() => 0);
            let playedCount = 0;

            for (let h = 1; h <= 18; h++) {
                let holeHasScore = false;
                
                state.players.forEach((_, pIdx) => {
                    const pts = state.scores[h][pIdx] || 0;
                    if (pts > 0) holeHasScore = true;
                    totals[pIdx] += pts;
                });

                if (holeHasScore || state.ties[h]) playedCount++;
            }

            return { totals, playedCount };
        }

        function renderLiveTotals() {
            const { totals, playedCount } = calculateTotals();
            document.getElementById('completedHolesCount').innerText = `${playedCount} / 18 Played`;

            const container = document.getElementById('liveTotalsList');
            container.innerHTML = '';

            state.players.forEach((pName, pIdx) => {
                const tot = totals[pIdx];
                container.innerHTML += `
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 flex justify-between items-center">
                        <span class="text-xs font-semibold text-slate-300 truncate">${pName}</span>
                        <span class="text-sm font-bold ${tot > 0 ? 'text-emerald-400' : 'text-slate-400'}">
                            ${tot} pts
                        </span>
                    </div>
                `;
            });
        }

        function toggleScoreModal(show) {
            const modal = document.getElementById('scoreModal');
            if (show) {
                renderMatrixTable();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function renderMatrixTable() {
            const { totals } = calculateTotals();

            // Modal Live Ranking
            const standingsContainer = document.getElementById('modalStandings');
            standingsContainer.innerHTML = '';

            const ranked = state.players.map((name, idx) => ({ name, pts: totals[idx] }))
                .sort((a, b) => b.pts - a.pts);

            ranked.forEach((item, rIdx) => {
                standingsContainer.innerHTML += `
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-400"><strong class="text-white">#${rIdx + 1}</strong> ${item.name}</span>
                        <span class="font-bold ${item.pts > 0 ? 'text-emerald-400' : 'text-slate-400'}">
                            ${item.pts} pts
                        </span>
                    </div>
                `;
            });

            // Table Headers
            const headerRow = document.getElementById('matrixHeaderRow');
            headerRow.innerHTML = `
                <th class="py-2 px-1">Hole</th>
                <th class="py-2 px-1 text-center">Mult</th>
            ` + state.players.map(p => `<th class="py-2 px-1 text-right truncate max-w-[60px]">${p}</th>`).join('');

            // Table Rows
            const tbody = document.getElementById('matrixTableBody');
            tbody.innerHTML = '';

            for (let h = 1; h <= 18; h++) {
                const mult = getHoleMultiplier(h);
                const playerCells = state.players.map((_, pIdx) => {
                    const pts = state.scores[h][pIdx] || 0;
                    const color = pts > 0 ? 'text-emerald-400 font-bold' : 'text-slate-600';
                    return `<td class="py-2 px-1 text-right font-mono ${color}">${pts > 0 ? '+' + pts : pts}</td>`;
                }).join('');

                tbody.innerHTML += `
                    <tr class="${state.currentHole === h ? 'bg-emerald-500/10' : ''}">
                        <td class="py-2 px-1 font-medium text-slate-400">Hole ${h}</td>
                        <td class="py-2 px-1 text-center font-bold ${mult > 1 ? 'text-amber-400' : 'text-slate-600'}">${mult}x</td>
                        ${playerCells}
                    </tr>
                `;
            }
        }

        function showResults() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            document.getElementById('resultGameTitle').innerText = state.title;

            const { totals } = calculateTotals();

            const ranked = state.players.map((name, idx) => ({
                name,
                points: totals[idx]
            })).sort((a, b) => b.points - a.points);

            const container = document.getElementById('finalLeaderboard');
            container.innerHTML = '';

            ranked.forEach((item, index) => {
                const isWinner = index === 0 && item.points > 0;
                container.innerHTML += `
                    <div class="bg-slate-900 border ${isWinner ? 'border-amber-500/50 bg-amber-500/5' : 'border-slate-800'} rounded-xl p-4 flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <span class="text-lg font-black ${index === 0 ? 'text-amber-400' : 'text-slate-500'}">#${index + 1}</span>
                            <h3 class="font-bold text-white text-base">${item.name}</h3>
                        </div>
                        <span class="text-2xl font-black ${item.points > 0 ? 'text-emerald-400' : 'text-slate-400'}">
                            ${item.points} pts
                        </span>
                    </div>
                `;
            });
        }

        function confirmReset() {
            if (confirm("Start a new game? Current match data will be reset.")) {
                location.reload();
            }
        }
    </script>
</body>
</html>
